name: Deploy Static Website to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create SSH Key and Set Permissions
        run: |
          echo -e "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > github.pem
          chmod 400 github.pem  # Ensure correct permissions

      - name: Copy files to EC2 using SCP
        run: |
          scp -o StrictHostKeyChecking=no -i github.pem -r * ubuntu@${{ secrets.EC2_HOST }}:/var/www/html/

      - name: Restart Nginx on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i github.pem ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            sudo systemctl restart nginx
          EOF
